version: '3.8'

services:
  web:
    image: drupal:10-apache
    container_name: sciencecampus-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - drupal_modules:/var/www/html/modules
      - drupal_profiles:/var/www/html/profiles
      - drupal_sites:/var/www/html/sites
      - ../web/themes/custom:/var/www/html/themes/custom
    depends_on:
      - db
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_PORT: 3306
      DRUPAL_DB_NAME: drupal
      DRUPAL_DB_USER: drupal
      DRUPAL_DB_PASSWORD: drupal_sc_2026

  db:
    image: mariadb:10.11
    container_name: sciencecampus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: drupal_sc_2026
      MYSQL_ROOT_PASSWORD: root_sc_2026
    volumes:
      - db_data:/var/lib/mysql

volumes:
  drupal_modules:
  drupal_profiles:
  drupal_sites:
  db_data:
