# Nginx reverse proxy for dev.sciencecampus.bme.hu
# Place this at: /etc/nginx/sites-available/sciencecampus
# Then: ln -s /etc/nginx/sites-available/sciencecampus /etc/nginx/sites-enabled/
# Then: certbot --nginx -d dev.sciencecampus.bme.hu

server {
    listen 80;
    server_name dev.sciencecampus.bme.hu;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
